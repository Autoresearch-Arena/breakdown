    <text x="872" y="690">5.7<tspan fill="#facc59"> → 4.0</tspan><tspan font-size="13" font-weight="400" fill="#9aa6b6" dx="5">mm</tspan><tspan font-family="-apple-system, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9aa6b6" dx="4">right</tspan></text>
  </g>
