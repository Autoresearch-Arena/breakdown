<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, sans-serif">
  <!-- Breakdown aiming panel redesign, Mac window / iPad sideways, just after a shot (planned against delivered).
       Claude Opus 5.5 Medium, 26-Nov-2026. -->
